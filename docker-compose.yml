version: '3.9'
services:
  postgres:
    image: postgres:17
    container_name: pms-postgres
    environment:
      POSTGRES_DB: pms_db
      POSTGRES_USER: pms_user
      POSTGRES_PASSWORD: pms_pass
    ports:
      - "5432:5432"
    volumes:
      - pms_pg_data:/var/lib/postgresql/data

volumes:
  pms_pg_data:
